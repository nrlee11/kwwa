<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="" />
        <meta property="og:title" content="한국상하수도협회" />
        <meta property="og:description" content="" />
        <meta property="og:image" content="" />
        <meta name="format-detection" content="telephone=no" />
        <link rel="stylesheet" type="text/css" href="/resources/css/common.css" />
        <link rel="icon" type="image/x-icon" href="/resources/images/favicon/favicon.ico" />
        <title>최종 학력 선택 | 한국상하수도협회</title>
    </head>
    <body>
        <!-- wrap(s) -->
        <div id="wrap" class="wrap">
            <div class="layerDim" style="display: none"></div>

            <div style="height: 100%; display: flex; align-items: center; justify-content: center">
                <div>
                    <button type="button" class="btn_primary_lg" id="alert">최종 학력 선택</button>
                </div>
            </div>
        </div>
        <!--// wrap(e) -->

        <!-- Layer : 최종 학력 선택 -->
        <div class="layerFix alertPopup" id="alertPop" role="dialog" aria-modal="true" style="display: none" tabindex="0">
            <div class="layer_wrap">
                <div class="head">
                    <strong class="tit">자격취득 가능여부 자가진단</strong>
                </div>
                <div class="cont">
                    <div class="tit_area">
                        <strong class="tit">최종 학력 선택</strong>
                    </div>

                    <div class="article">
                        <div class="question_area">
                            <div class="question_box">
                                <storng class="tit">Q. 귀하의 최종 학력은 어떻게 되십니까?</storng>
                            </div>
                            <div class="answer_box">
                                <div class="radio_set">
                                    <span class="inp_radio">
                                        <input type="radio" id="label1" name="label" checked />
                                        <label for="label1">고등학교 졸업</label>
                                    </span>
                                    <span class="inp_radio">
                                        <input type="radio" id="label2" name="label" />
                                        <label for="label2">2년제 대학 이공계 학과 졸업</label>
                                    </span>
                                    <span class="inp_radio">
                                        <input type="radio" id="label3" name="label" />
                                        <label for="label3">4년제 대학 이공계 학과 졸업</label>
                                    </span>
                                    <span class="inp_radio">
                                        <input type="radio" id="label4" name="label" />
                                        <label for="label4">2, 4년제 대학 비이공계(인문, 사회, 체육, 예술 등) 학과 졸업</label>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="foot">
                    <div class="btn_area">
                        <div class="lside">
                            <button type="button" class="btn_outline_md">이전</button>
                        </div>
                        <div class="rside">
                            <button type="button" class="btn_primary_md">다음</button>
                        </div>
                    </div>
                </div>
                <button class="btn_close layer_close"><span class="hidden">닫기</span></button>
            </div>
        </div>
        <!--// Layer : 최종 학력 선택 -->

        <script src="/resources/js/jquery-2.2.4.min.js"></script>
        <script src="/resources/js/ui.js"></script>
        <script type="text/javascript">
            $(function () {
                // Layer : 최종 학력 선택
                $("#alert").click(function (e) {
                    $("html").addClass("layerOpen");
                    $("#wrap").attr("aria-hidden", "true");
                    $(".layerDim").show();
                    $("#alertPop").show().focus();
                });
                $("#alertPop .layer_close").click(function (e) {
                    $("#alert").focus(); // 접근성
                });
            });
        </script>
    </body>
</html>
