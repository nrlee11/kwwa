<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="" />
        <meta property="og:title" content="한국상하수도협회" />
        <meta property="og:description" content="" />
        <meta property="og:image" content="" />
        <meta name="format-detection" content="telephone=no" />
        <link rel="stylesheet" type="text/css" href="/resources/css/common.css" />
        <link rel="stylesheet" type="text/css" href="/resources/css/jquery-ui.css" />
        <link rel="icon" type="image/x-icon" href="/resources/images/favicon/favicon.ico" />
        <title>교과 편성표 | 한국상하수도협회</title>
    </head>
    <body>
        <!-- wrap(s) -->
        <div id="wrap" class="wrap">
            <div class="layerDim" style="display: none"></div>

            <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center">
                <div>
                    <button type="button" class="btn_primary_lg eduProgram">교과 편성표</button>
                </div>
            </div>
        </div>
        <!--// wrap(e) -->

        <!-- [include] side(s) : 확인용 -->
        <div data-include-file="/html/include/side.html" class="includeJs"></div>
        <!--// [include] side(e) : 확인용 -->

        <!-- Layer : 교과 편성표 -->
        <div class="layerFix fullPopup" id="eduProgramPop" role="dialog" aria-modal="true" style="display: none" tabindex="0">
            <div class="layer_wrap">
                <div class="head">
                    <strong class="tit">상하수도 국가전문자격시스템</strong>
                </div>
                <div class="cont">
                    <div class="tit_area">
                        <strong class="tit">교과 편성표</strong>
                    </div>
                    <div class="layer_scroll">
                        <div class="article">
                            <!-- board -->
                            <div class="board_area">
                                <div class="scroll_guide">
                                    <p class="txt_scroll">밀어서 보기</p>
                                </div>

                                <div class="scroll_area">
                                    <!-- board_view -->
                                    <table class="tbl sm">
                                        <caption>
                                            NO, 과목명, 교과 내용, 비율(%) 정보 제공
                                        </caption>
                                        <colgroup>
                                            <col style="width: 66px" />
                                            <col style="width: 137px" />
                                            <col style="width: 236px" />
                                            <col style="width: 73px" />
                                        </colgroup>
                                        <thead>
                                            <tr>
                                                <th scope="col">NO</th>
                                                <th scope="col">과목명</th>
                                                <th scope="col">교과 내용</th>
                                                <th scope="col">비율(%)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr>
                                                <td rowspan="2"><div>1</div></td>
                                                <td class="left" rowspan="2"><div>정수장 공정관리 및 수리학</div></td>
                                                <td class="left"><div>정수처리 공정관리</div></td>
                                                <td rowspan="2"><div>24% 이상</div></td>
                                            </tr>
                                            <tr>
                                                <td class="left line"><div>정수시설 수리학</div></td>
                                            </tr>
                                            <tr>
                                                <td rowspan="3"><div>2</div></td>
                                                <td class="left" rowspan="3"><div>정수장 수질관리</div></td>
                                                <td class="left"><div>정수장 수질관리</div></td>
                                                <td rowspan="3"><div>29% 이상</div></td>
                                            </tr>
                                            <tr>
                                                <td class="left line"><div>시료 측정분석</div></td>
                                            </tr>
                                            <tr>
                                                <td class="left line"><div>정수 공정운영실험</div></td>
                                            </tr>
                                            <tr>
                                                <td rowspan="3"><div>3</div></td>
                                                <td class="left" rowspan="3"><div>정수장 설비관리</div></td>
                                                <td class="left"><div>기계설비 관리</div></td>
                                                <td rowspan="3"><div>29% 이상</div></td>
                                            </tr>
                                            <tr>
                                                <td class="left line"><div>전기설비 관리</div></td>
                                            </tr>
                                            <tr>
                                                <td class="left line"><div>계측제어 설비관리</div></td>
                                            </tr>
                                            <tr>
                                                <td rowspan="2"><div>4</div></td>
                                                <td class="left" rowspan="2"><div>배출수처리시설 및 안정 위기 관리</div></td>
                                                <td class="left"><div>배출수처리시설 관리</div></td>
                                                <td rowspan="2"><div>19% 이상</div></td>
                                            </tr>
                                            <tr>
                                                <td class="left line"><div>안정 위기 대응관리</div></td>
                                            </tr>
                                        </tbody>
                                    </table>
                                    <!--// board_view -->
                                </div>
                            </div>
                            <!--// board -->
                        </div>
                    </div>
                </div>
                <div class="foot">
                    <div class="btn_area">
                        <button type="button" class="btn_primary_md layer_close">닫기</button>
                    </div>
                </div>
                <button class="btn_close layer_close"><span class="hidden">닫기</span></button>
            </div>
        </div>
        <!--// Layer : 교과 편성표 -->

        <script src="/resources/js/jquery-2.2.4.min.js"></script>
        <script src="/resources/js/ui.js"></script>
        <script type="text/javascript">
            $(function () {
                // Layer : 교과 편성표
                $(".eduProgram").click(function (e) {
                    $("html").addClass("layerOpen");
                    $("#wrap").attr("aria-hidden", "true");
                    $(".layerDim").show();
                    $("#eduProgramPop").show().focus();
                });
                $("#eduProgramPop .layer_close").click(function (e) {
                    $(".eduProgram").focus(); // 접근성
                });
            });
        </script>
    </body>
</html>
