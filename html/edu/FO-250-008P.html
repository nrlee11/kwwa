<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="" />
        <meta property="og:title" content="한국상하수도협회" />
        <meta property="og:description" content="" />
        <meta property="og:image" content="" />
        <meta name="format-detection" content="telephone=no" />
        <link rel="stylesheet" type="text/css" href="/resources/css/common.css" />
        <link rel="icon" type="image/x-icon" href="/resources/images/favicon/favicon.ico" />
        <title>강의실 | 양성교육 | 한국상하수도협회</title>
    </head>
    <body>
        <!-- wrap(s) -->
        <div id="wrap" class="wrap">
            <!-- container(s) -->
            <div class="container_avi">
                <div class="lside">
                    <!-- title(s) -->
                    <div class="tit_area">
                        <h1 class="tit"><span class="num">1.</span> 정수장 공정관리 및 수리학</h1>
                        <button type="button" class="btn_mo" aria-controls="aviPlayer">차시목차메뉴</button>
                    </div>
                    <!-- // title(e) -->

                    <div class="avi_box">
                        <!-- 임시 영역: 영상 -->
                        <!-- [D] 영상추가시 제거 -->
                        <div style="height: 100%; background: black; font-size: 40px; color: white">영상영역</div>
                        <!-- // 임시 영역: 영상 -->
                    </div>
                </div>

                <div class="rside" id="aviPlayer">
                    <div class="inner">
                        <div class="tit_area center">
                            <h2 class="tit">학습목차</h2>
                        </div>
                        <div class="avi_area">
                            <ul class="avi_list">
                                <li class="avi_item">
                                    <strong class="tit">
                                        <span class="txt_avi"> 1장-정수처리 공정관리 </span>
                                    </strong>
                                    <ul class="sub_list">
                                        <li>
                                            <!-- [D] 현재 선택된 : aria-current='true' -->
                                            <button type="button" aria-current="true" class="btn_avi">
                                                <span class="txt_avi">1차시</span>
                                            </button>
                                        </li>
                                        <li>
                                            <button type="button" aria-current="false" class="btn_avi">
                                                <span class="txt_avi">2차시</span>
                                            </button>
                                        </li>
                                        <li>
                                            <button type="button" aria-current="false" class="btn_avi">
                                                <span class="txt_avi">3차시</span>
                                            </button>
                                        </li>
                                    </ul>
                                </li>
                                <li class="avi_item">
                                    <strong class="tit">
                                        <span class="txt_avi">2장-정수시설 수리학</span>
                                    </strong>
                                    <ul class="sub_list">
                                        <li>
                                            <button type="button" aria-current="false" class="btn_avi">
                                                <span class="txt_avi">4차시</span>
                                            </button>
                                        </li>
                                        <li>
                                            <button type="button" aria-current="false" class="btn_avi">
                                                <span class="txt_avi">5차시</span>
                                            </button>
                                        </li>
                                        <li>
                                            <button type="button" aria-current="false" class="btn_avi">
                                                <span class="txt_avi">6차시</span>
                                            </button>
                                        </li>
                                        <li>
                                            <button type="button" aria-current="false" class="btn_avi">
                                                <span class="txt_avi">7차시</span>
                                            </button>
                                        </li>
                                        <li>
                                            <button type="button" aria-current="false" class="btn_avi">
                                                <span class="txt_avi">8차시</span>
                                            </button>
                                        </li>
                                    </ul>
                                </li>
                            </ul>
                        </div>
                        <button class="btn">진도 저장 후 종료</button>
                    </div>
                </div>
            </div>
            <!--// container(e) -->
        </div>
        <!--// wrap(e) -->

        <!-- [include] side(s) : 확인용 -->
        <div data-include-file="/html/include/side.html" class="includeJs"></div>
        <!--// [include] side(e) : 확인용 -->

        <script src="/resources/js/jquery-2.2.4.min.js"></script>
        <script src="/resources/js/ui.js"></script>
        <!-- [D] ui확인용 (s) -->
        <script>
            $(function () {});
        </script>
        <!-- // [D] ui확인용 (e) -->
    </body>
</html>
