<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="" />
        <meta property="og:title" content="한국상하수도협회" />
        <meta property="og:description" content="" />
        <meta property="og:image" content="" />
        <meta name="format-detection" content="telephone=no" />
        <link rel="stylesheet" type="text/css" href="/resources/css/common.css" />
        <title>서류제출 | 실무교육 | 한국상하수도협회</title>
    </head>
    <body>
        <!-- wrap(s) -->
        <div id="wrap" class="wrap">
            <!-- [include] header(s) : 확인용 -->
            <div data-include-file="../include/header.html" class="includeJs"></div>
            <!--// [include] header(e) : 확인용 -->

            <!-- container(s) -->
            <div id="container" class="container">
                <div class="lyinner">
                    <!-- [include] aside(s) : 확인용 -->
                    <div data-include-file="../include/aside.html" class="includeJs"></div>
                    <!--// [include] aside(e) : 확인용 -->

                    <!-- contents(s) -->
                    <div id="contents" class="contents">
                        <!-- breadcrumb(s) -->
                        <nav class="breadcrumb_wrap" aria-label="현재 경로">
                            <ol class="breadcrumb">
                                <li><a href="javascript:;">홈</a></li>
                                <li><a href="javascript:;">실무교육</a></li>
                                <li><span>서류제출</span></li>
                            </ol>
                        </nav>
                        <!--// breadcrumb(e) -->

                        <!-- page_title(s) -->
                        <div class="page_title">
                            <h2 class="tit">서류제출</h2>
                        </div>
                        <!--// page_title(e) -->

                        <!-- section(s) -->
                        <div class="section">
                            <!-- progress -->
                            <div class="progress-bar">
                                <strong class="hidden">서류제출 진행순서</strong>
                                <div class="on">
                                    <span class="step">
                                        <span>1단계</span>
                                    </span>
                                    <strong>신청서 작성</strong>
                                    <span class="hidden">현재 진행 단계</span>
                                </div>
                                <div>
                                    <span class="step">
                                        <span>2단계</span>
                                    </span>
                                    <strong>신청정보 확인</strong>
                                </div>
                                <div>
                                    <span class="step">
                                        <span>3단계</span>
                                    </span>
                                    <strong>신청완료</strong>
                                </div>
                            </div>
                            <!--// progress -->
                        </div>
                        <!--// section(e) -->

                        <!-- section(s) -->
                        <div class="section">
                            <div class="tit_area">
                                <h3 class="tit">신청자 정보</h3>
                            </div>

                            <!-- form-->
                            <div class="form_section">
                                <div class="form_desc_top">
                                    <div class="lside">※ 회원가입시 인증받은 정보입니다. 개인정보는 마이페이지&gt;회원정보에서 변경 가능합니다.</div>
                                    <div class="rside">
                                        <button type="button" class="btn_secondary_lg">마이페이지<span class="ico_outlink" aria-hidden="true"></span></button>
                                    </div>
                                </div>

                                <!-- write -->
                                <div class="form_list table">
                                    <div class="form_group">
                                        <div class="tit">
                                            <label for="userName">이름</label>
                                        </div>
                                        <div class="item">
                                            <div class="cell">
                                                <div class="form_item">
                                                    <div class="inp size_289">
                                                        <!-- (공통)접근성 : id값 변경 시 label for값도 동일하게 변경 -->
                                                        <input type="text" value="홍길동" id="userName" readonly />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form_group">
                                        <div class="tit">
                                            <label for="birthDate">생년월일</label>
                                        </div>
                                        <div class="item">
                                            <div class="cell">
                                                <div class="form_item">
                                                    <div class="inp size_289">
                                                        <input type="tel" value="1980.01.01" id="birthDate" readonly />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form_group">
                                        <div class="tit">
                                            <label for="cellPhone">휴대폰 번호</label>
                                        </div>
                                        <div class="item">
                                            <div class="cell">
                                                <div class="form_item">
                                                    <div class="inp size_289">
                                                        <input type="tel" value="010-1234-5678" id="cellPhone" readonly />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form_group">
                                        <div class="tit">
                                            <label for="phoneNum">전화번호</label>
                                        </div>
                                        <div class="item">
                                            <div class="cell">
                                                <div class="form_item">
                                                    <div class="phone_set">
                                                        <div class="inp_select">
                                                            <select title="전화번호 국번 선택" id="phoneNum">
                                                                <option value="">선택</option>
                                                                <option value="02">서울 (02)</option>
                                                                <option value="031">경기 (031)</option>
                                                                <option value="032">인천 (032)</option>
                                                                <option value="033">강원 (033)</option>
                                                                <option value="041">충남 (041)</option>
                                                                <option value="042">대전 (042)</option>
                                                                <option value="043">충북 (043)</option>
                                                                <option value="044">세종 (044)</option>
                                                                <option value="051">부산 (051)</option>
                                                                <option value="052">울산 (052)</option>
                                                                <option value="053">대구 (053)</option>
                                                                <option value="054">경북 (054)</option>
                                                                <option value="055">경남 (055)</option>
                                                                <option value="061">전남 (061)</option>
                                                                <option value="062">광주 (062)</option>
                                                                <option value="063">전북 (063)</option>
                                                                <option value="064">제주 (064)</option>
                                                                <option value="070">인터넷전화 (070)</option>
                                                                <option value="050">평생전화 (050)</option>
                                                            </select>
                                                        </div>
                                                        <div class="inp_set">
                                                            <span class="txt_dash">-</span>
                                                            <div class="inp">
                                                                <input type="tel" value="1234" title="전화번호 앞자리 입력" />
                                                            </div>
                                                        </div>
                                                        <div class="inp_set">
                                                            <span class="txt_dash">-</span>
                                                            <div class="inp">
                                                                <input type="tel" value="1234" title="전화번호 뒷자리 입력" />
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!--// write -->
                            </div>
                            <!--// form-->
                        </div>
                        <!--// section(e) -->

                        <!-- section(s) -->
                        <div class="section">
                            <div class="tit_area">
                                <h3 class="tit">양성교육과정 정보</h3>
                            </div>

                            <!-- board(s) -->
                            <div class="board_area">
                                <!-- board_view -->
                                <table class="tbl react row">
                                    <caption class="hidden">
                                        신청 번호, 상태, 자격종목, 신청일, 반려구분, 반려일, 사유 정보 제공
                                    </caption>
                                    <colgroup>
                                        <col style="width: 15.3rem" />
                                        <col />
                                        <col style="width: 15.3rem" />
                                        <col />
                                    </colgroup>
                                    <tbody>
                                        <tr>
                                            <th scope="row">과정명</th>
                                            <td data-cell-header="과정명" colspan="3"><div>상수도관망시설운영관리사 2급</div></td>
                                        </tr>
                                        <tr>
                                            <th scope="row">기수</th>
                                            <td data-cell-header="기수"><div>22기</div></td>
                                            <th scope="row">기간</th>
                                            <td data-cell-header="기간"><div>2025-01-02~2025-02-15</div></td>
                                        </tr>
                                        <tr>
                                            <th scope="row">수료일</th>
                                            <td data-cell-header="수료일"><div>2025-01-02</div></td>
                                            <th scope="row">확인</th>
                                            <td data-cell-header="확인"><div></div></td>
                                        </tr>
                                    </tbody>
                                </table>
                                <!--// board_view -->
                            </div>
                            <!--// board(e) -->
                        </div>
                        <!--// section(e) -->
                    </div>
                    <!--// contents(e) -->
                </div>
            </div>
            <!--// container(e) -->

            <!-- [include] footer(s) : 확인용 -->
            <div data-include-file="../include/footer.html" class="includeJs"></div>
            <!--// [include] footer(e) : 확인용 -->
        </div>
        <!--// wrap(e) -->
        <script src="/resources/js/jquery-2.2.4.min.js"></script>
        <script src="/resources/js/ui.js"></script>
    </body>
</html>
