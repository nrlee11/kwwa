<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="" />
        <meta property="og:title" content="한국상하수도협회" />
        <meta property="og:description" content="" />
        <meta property="og:image" content="" />
        <meta name="format-detection" content="telephone=no" />
        <link rel="stylesheet" type="text/css" href="/resources/css/common.css" />
        <link rel="stylesheet" type="text/css" href="/resources/css/jquery-ui.css" />
        <link rel="icon" type="image/x-icon" href="/resources/images/favicon/favicon.ico" />
        <title>실무교육 확인조회 | 실무교육 | 한국상하수도협회</title>
    </head>
    <body>
        <!-- wrap(s) -->
        <div id="wrap" class="wrap">
            <!-- [include] header(s) : 확인용 -->
            <div data-include-file="../include/header.html" class="includeJs"></div>
            <!--// [include] header(e) : 확인용 -->

            <!-- container(s) -->
            <div id="container" class="container">
                <div class="lyinner">
                    <!-- [include] aside(s) : 확인용 -->
                    <div data-include-file="../include/aside.html" class="includeJs"></div>
                    <!--// [include] aside(e) : 확인용 -->

                    <!-- contents(s) -->
                    <div id="contents" class="contents">
                        <!-- breadcrumb(s) -->
                        <nav class="breadcrumb_wrap">
                            <ol class="breadcrumb">
                                <li><a href="javascript:;">홈</a></li>
                                <li><a href="javascript:;">실무교육</a></li>
                                <li><span>실무교육 확인조회</span></li>
                            </ol>
                        </nav>
                        <!--// breadcrumb(e) -->

                        <!-- page_title(s) -->
                        <div class="page_title">
                            <h2 class="tit">반려 사유 안내</h2>
                        </div>
                        <!--// page_title(e) -->

                        <!-- section(s) -->
                        <div class="section">
                            <!-- board -->
                            <div class="board_area">
                                <!-- board_view -->
                                <table class="tbl row size110">
                                    <caption class="hidden">
                                        신청번호, 자격종목, 신청일, 반려구분, 반려일, 반려사유 정보 제공
                                    </caption>
                                    <colgroup>
                                        <col style="width: 15.3rem" />
                                        <col style="width: 29.1rem" />
                                        <col style="width: 15.3rem" />
                                        <col style="width: 29.1rem" />
                                    </colgroup>
                                    <tbody>
                                        <tr>
                                            <th scope="row">신청번호</th>
                                            <td data-cell-header="신청번호" colspan="3"><div>A000000</div></td>
                                        </tr>
                                        <tr>
                                            <th scope="row">자격종목</th>
                                            <td data-cell-header="자격종목"><div>상수도관망시설운영관리사 1급</div></td>
                                            <th scope="row">신청일</th>
                                            <td data-cell-header="신청일"><div>2025-02-02</div></td>
                                        </tr>
                                        <tr>
                                            <th scope="row">반려구분</th>
                                            <td data-cell-header="반려구분"><div>자격요건 미충족</div></td>
                                            <th scope="row">반려일</th>
                                            <td data-cell-header="반려일"><div>2025.02.02</div></td>
                                        </tr>
                                        <tr>
                                            <th scope="row">반려사유</th>
                                            <td data-cell-header="반려사유" colspan="3"><div>관리자 메모 출력</div></td>
                                        </tr>
                                    </tbody>
                                </table>
                                <!--// board_view -->

                                <div class="board_desc_bottom">
                                    <ul class="list_mark">
                                        <li>반려로 인해 보내주신 제출된 서류는 전부 파쇄 함을 알려드립니다.</li>
                                    </ul>
                                </div>
                            </div>
                            <!--// board -->
                        </div>
                        <!--// section(e) -->

                        <div class="bottom_btn_area">
                            <button type="button" class="btn_primary_lg">재 신청 하기</button>
                        </div>
                    </div>
                    <!--// contents(e) -->
                </div>
            </div>
            <!--// container(e) -->

            <!-- [include] footer(s) : 확인용 -->
            <div data-include-file="../include/footer.html" class="includeJs"></div>
            <!--// [include] footer(e) : 확인용 -->
        </div>
        <!--// wrap(e) -->
        <script src="/resources/js/jquery-2.2.4.min.js"></script>
        <script src="/resources/js/ui.js"></script>
        <script src="/resources/js/jquery-ui.js"></script>
        <script>
            // 달력 샘플
            $.datepicker.setDefaults($.datepicker.regional["ko"]);
            $("#startDate, #endDate, #startDate1, #endDate1").datepicker({
                dateFormat: "yy-mm-dd",
                showOtherMonths: true,
                showMonthAfterYear: true,
                nextText: "다음 달",
                prevText: "이전 달",
                monthNamesShort: ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월", "11월", "12월"],
                monthNames: ["1월", "2월", "3월", "4월", "5월", "6월", "7월", "8월", "9월", "10월", "11월", "12월"],
                dayNamesMin: ["일", "월", "화", "수", "목", "금", "토"],
                ignoreReadonly: true,
                buttonImageOnly: false,
                beforeShow: function (input, inst) {
                    $(".calendar_wrap").show().append($("#ui-datepicker-div"));
                },
                onSelect: function (dateText, inst) {
                    $(".calendar_wrap").hide();
                },
            });
            $(".calendar_wrap .dim").click(function () {
                $(".calendar_wrap").hide();
                console.log("aaaa");
            });

            // 첨부파일 샘플
            $("#file1, #file2, #file3, #file4").on("change", function () {
                var fileName = $(this).val().split("/").pop().split("\\").pop(); // 파일명만 추출
                $(this).parent().children().children("input").val(fileName);
            });
            $(".file_set .btn_reset").click(function () {
                $(this).parent().children("input").val(""); // 파일명 삭제
            });
        </script>
    </body>
</html>
