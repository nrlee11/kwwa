<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="" />
        <meta property="og:title" content="한국상하수도협회" />
        <meta property="og:description" content="" />
        <meta property="og:image" content="" />
        <meta name="format-detection" content="telephone=no" />
        <link rel="stylesheet" type="text/css" href="/resources/css/common.css" />
        <title>통합회원 가입 | 한국상하수도협회</title>
    </head>
    <body>
        <!-- wrap(s) -->
        <div id="wrap" class="wrap">
            <!-- [include] header(s) : 확인용 -->
            <div data-include-file="../include/header.html" class="includeJs"></div>
            <!--// [include] header(e) : 확인용 -->

            <!-- container(s) -->
            <div id="container" class="container">
                <div class="lyinner">
                    <!-- contents(s) -->
                    <div id="contents" class="contents">
                        <div class="join-wrap">
                            <!-- page_title(s) -->
                            <div class="page_title">
                                <h2 class="tit">통합회원 가입</h2>
                            </div>
                            <!--// page_title(e) -->
                        </div>

                        <!-- section(s) -->
                        <div class="section">
                            <!-- progress(s) -->
                            <div class="progress-bar" aria-label="가입하기 진행순서">
                                <div class="on">
                                    <span class="step">
                                        <span>1단계</span>
                                    </span>
                                    <strong>이용약관 동의</strong>
                                    <span class="hidden">현재 진행 단계</span>
                                </div>
                                <div>
                                    <span class="step">
                                        <span>2단계</span>
                                    </span>
                                    <strong>본인인증</strong>
                                </div>
                                <div>
                                    <span class="step">
                                        <span>3단계</span>
                                    </span>
                                    <strong>정보 입력</strong>
                                </div>
                                <div>
                                    <span class="step">
                                        <span>4단계</span>
                                    </span>
                                    <strong>가입완료</strong>
                                </div>
                            </div>
                            <!--// progress(e) -->
                        </div>
                        <!--// section(e) -->
                    </div>
                    <!--// contents(e) -->
                </div>
            </div>
            <!--// container(e) -->

            <!-- [include] footer(s) : 확인용 -->
            <div data-include-file="../include/footer.html" class="includeJs"></div>
            <!--// [include] footer(e) : 확인용 -->
        </div>
        <!--// wrap(e) -->
        <script src="http://code.jquery.com/jquery-latest.min.js"></script>
        <script src="/resources/js/ui.js"></script>
    </body>
</html>
