<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="" />
        <meta property="og:title" content="한국상하수도협회" />
        <meta property="og:description" content="" />
        <meta property="og:image" content="" />
        <meta name="format-detection" content="telephone=no" />
        <link rel="stylesheet" type="text/css" href="/resources/css/common.css" />
        <title>본인인증 | 회원 가입 | 한국상하수도협회</title>
    </head>
    <body>
        <!-- wrap(s) -->
        <div id="wrap" class="wrap">
            <!-- [include] header(s) : 확인용 -->
            <div data-include-file="../include/header.html" class="includeJs"></div>
            <!--// [include] header(e) : 확인용 -->

            <!-- container(s) -->
            <div id="container" class="container">
                <div class="lyinner">
                    <!-- contents(s) -->
                    <div id="contents" class="contents">
                        <!-- join_wrap(s) -->
                        <div class="join_wrap">
                            <!-- page_title(s) -->
                            <div class="page_title">
                                <h2 class="tit">회원 가입</h2>
                            </div>
                            <!--// page_title(e) -->

                            <!-- section(s) -->
                            <div class="section">
                                <!-- progress(s) -->
                                <div class="progress-bar">
                                    <strong class="hidden">회원가입 진행순서</strong>
                                    <div class="completion">
                                        <span class="step">
                                            <span>1단계</span>
                                        </span>
                                        <strong>이용약관 동의</strong>
                                        <span class="hidden">완료</span>
                                    </div>
                                    <div class="on">
                                        <span class="step">
                                            <span>2단계</span>
                                        </span>
                                        <strong>본인인증</strong>
                                        <span class="hidden">현재 진행 단계</span>
                                    </div>
                                    <div>
                                        <span class="step">
                                            <span>3단계</span>
                                        </span>
                                        <strong>정보 입력</strong>
                                    </div>
                                    <div>
                                        <span class="step">
                                            <span>4단계</span>
                                        </span>
                                        <strong>가입완료</strong>
                                    </div>
                                </div>
                                <!--// progress(e) -->

                                <!-- join_section(s) -->
                                <div class="join_section">
                                    <div class="auth_area">
                                        <button type="button">
                                            휴대폰 본인 인증
                                            <span class="ico_auth1"></span>
                                        </button>
                                        <button type="button">
                                            통합인증(간편인증)
                                            <span class="ico_auth2"></span>
                                        </button>
                                    </div>

                                    <div class="notice_box">
                                        <p class="ico_txt"><span class="ico_mark"></span> 주의사항 : 회원가입 시 본인 인증은 본인명의 핸드폰만 가능 합니다.</p>
                                    </div>

                                    <!-- btn(s) -->
                                    <div class="bottom_btn_area">
                                        <div class="lside">
                                            <button type="button" class="btn_outline_lg">이전</button>
                                        </div>
                                        <div class="rside">
                                            <button type="button" class="btn_primary_lg">다음</button>
                                        </div>
                                    </div>
                                    <!--// btn(e) -->
                                </div>
                                <!--// join_section(e) -->
                            </div>
                            <!--// section(e) -->
                        </div>
                        <!--// join_wrap(e) -->
                    </div>
                    <!--// contents(e) -->
                </div>
            </div>
            <!--// container(e) -->

            <!-- [include] footer(s) : 확인용 -->
            <div data-include-file="../include/footer.html" class="includeJs"></div>
            <!--// [include] footer(e) : 확인용 -->
        </div>
        <!--// wrap(e) -->
        <script src="http://code.jquery.com/jquery-latest.min.js"></script>
        <script src="/resources/js/ui.js"></script>
    </body>
</html>
