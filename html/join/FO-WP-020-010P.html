<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="" />
        <meta property="og:title" content="한국상하수도협회" />
        <meta property="og:description" content="" />
        <meta property="og:image" content="" />
        <meta name="format-detection" content="telephone=no" />
        <link rel="stylesheet" type="text/css" href="/resources/css/common.css" />
        <title>정보입력 | 통합회원 가입 | 한국상하수도협회</title>
    </head>
    <body>
        <!-- wrap(s) -->
        <div id="wrap" class="wrap">
            <div class="layerDim" style="display: none"></div>

            <div style="height: 100%; display: flex; align-items: center; justify-content: center">
                <div>
                    <button type="button" class="btn_primary_lg" id="emailValidation">이메일 인증하기 팝업</button>
                </div>
            </div>

            <!-- Layer : 이메일 인증하기 -->
            <div class="layerFix alertPopup" id="emailValidationPop" style="display: none" tabindex="0">
                <div class="layer_wrap">
                    <div class="head">
                        <strong class="tit">상하수도 국가전문자격시스템</strong>
                    </div>
                    <div class="cont">
                        <div class="alert_msg">
                            <div class="msg">
                                abc@abc.com 으로 이메일을 전송합니다.<br />
                                이메일에 포함된 인증번호(6자리 숫자)를 입력해 주세요.
                            </div>
                            <div class="txt">통신 또는 메일시스템 사정으로 인해 전송 시간이 걸릴 수 있습니다.</div>
                        </div>
                    </div>
                    <div class="foot">
                        <div class="btn_area">
                            <button type="button" class="btn_primary_md">확인</button>
                        </div>
                    </div>
                    <button class="btn_close layer_close"><span class="hidden">이메일 인증하기 닫기</span></button>
                </div>
            </div>
            <!--// Layer : 이메일 인증하기 -->
        </div>
        <!--// wrap(e) -->
        <script src="/resources/js/jquery-2.2.4.min.js"></script>
        <script src="/resources/js/ui.js"></script>
        <script type="text/javascript">
            $(function () {
                // Layer : 이메일 인증하기
                $("#emailValidation").click(function (e) {
                    $(".layerDim").show();
                    $("#emailValidationPop").show().focus();
                });
                $("#emailValidationPop .layer_close").click(function (e) {
                    $("#emailValidation").focus(); // 접근성
                });
            });
        </script>
    </body>
</html>
