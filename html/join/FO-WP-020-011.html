<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="" />
        <meta property="og:title" content="한국상하수도협회" />
        <meta property="og:description" content="" />
        <meta property="og:image" content="" />
        <meta name="format-detection" content="telephone=no" />
        <link rel="stylesheet" type="text/css" href="/resources/css/common.css" />
        <title>가입완료 | 회원 가입 | 한국상하수도협회</title>
    </head>
    <body>
        <!-- wrap(s) -->
        <div id="wrap" class="wrap">
            <!-- [include] header(s) : 확인용 -->
            <div data-include-file="../include/header.html" class="includeJs"></div>
            <!--// [include] header(e) : 확인용 -->

            <!-- container(s) -->
            <div id="container" class="container">
                <div class="lyinner">
                    <!-- contents(s) -->
                    <div id="contents" class="contents">
                        <!-- join_wrap(s) -->
                        <div class="join_wrap">
                            <!-- page_title(s) -->
                            <div class="page_title">
                                <h2 class="tit">회원 가입</h2>
                            </div>
                            <!--// page_title(e) -->

                            <!-- section(s) -->
                            <div class="section">
                                <!-- progress(s) -->
                                <div class="progress-bar">
                                    <strong class="hidden">회원가입 진행순서</strong>
                                    <div class="completion">
                                        <span class="step">
                                            <span>1단계</span>
                                        </span>
                                        <strong>이용약관 동의</strong>
                                        <span class="hidden">완료</span>
                                    </div>
                                    <div class="completion">
                                        <span class="step">
                                            <span>2단계</span>
                                        </span>
                                        <strong>본인인증</strong>
                                        <span class="hidden">완료</span>
                                    </div>
                                    <div class="completion">
                                        <span class="step">
                                            <span>3단계</span>
                                        </span>
                                        <strong>정보 입력</strong>
                                        <span class="hidden">완료</span>
                                    </div>
                                    <div class="on">
                                        <span class="step">
                                            <span>4단계</span>
                                        </span>
                                        <strong>가입완료</strong>
                                        <span class="hidden">현재 진행 단계</span>
                                    </div>
                                </div>
                                <!--// progress(e) -->

                                <!-- join_section(s) -->
                                <div class="join_section">
                                    <div class="completion_area">
                                        <span class="ico_completion"></span>
                                        <div class="msg">
                                            회원가입이<br class="mo_only" />
                                            완료되었습니다.
                                        </div>
                                        <div class="txt">로그인 후 다양한 서비스 이용이 가능합니다.</div>
                                    </div>

                                    <!-- btn(s) -->
                                    <div class="bottom_btn_area full">
                                        <button type="button" class="btn_primary_lg">로그인</button>
                                    </div>
                                    <!--// btn(e) -->
                                </div>
                                <!--// join_section(e) -->
                            </div>
                            <!--// section(e) -->
                        </div>
                        <!--// join_wrap(e) -->
                    </div>
                    <!--// contents(e) -->
                </div>
            </div>
            <!--// container(e) -->

            <!-- [include] footer(s) : 확인용 -->
            <div data-include-file="../include/footer.html" class="includeJs"></div>
            <!--// [include] footer(e) : 확인용 -->
        </div>
        <!--// wrap(e) -->
        <script src="/resources/js/jquery-2.2.4.min.js"></script>
        <script src="/resources/js/ui.js"></script>
    </body>
</html>
