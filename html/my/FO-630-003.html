<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="" />
        <meta property="og:title" content="한국상하수도협회" />
        <meta property="og:description" content="" />
        <meta property="og:image" content="" />
        <meta name="format-detection" content="telephone=no" />
        <link rel="stylesheet" type="text/css" href="/resources/css/common.css" />
        <link rel="icon" type="image/x-icon" href="/resources/images/favicon/favicon.ico" />
        <title>문의현황 | 마이페이지 | 한국상하수도협회</title>
    </head>
    <body>
        <!-- wrap(s) -->
        <div id="wrap" class="wrap">
            <!-- [include] header(s) : 확인용 -->
            <div data-include-file="../include/header.html" class="includeJs"></div>
            <!--// [include] header(e) : 확인용 -->

            <!-- container(s) -->
            <div id="container" class="container">
                <div class="lyinner">
                    <!-- [include] aside(s) : 확인용 -->
                    <div data-include-file="../include/aside.html" class="includeJs"></div>
                    <!--// [include] aside(e) : 확인용 -->

                    <!-- contents(s) -->
                    <div id="contents" class="contents">
                        <!-- breadcrumb(s) -->
                        <nav class="breadcrumb_wrap">
                            <ol class="breadcrumb">
                                <li><a href="javascript:;">홈</a></li>
                                <li><a href="javascript:;">마이페이지</a></li>
                                <li><span>문의현황</span></li>
                            </ol>
                        </nav>
                        <!--// breadcrumb(e) -->

                        <!-- page_title(s) -->
                        <div class="page_title">
                            <h2 class="tit">문의하기</h2>
                        </div>
                        <!--// page_title(e) -->

                        <!-- section(s) -->
                        <div class="section">
                            <!-- board -->
                            <div class="board_area">
                                <!-- form-->
                                <div class="form_section">
                                    <!-- board_write -->
                                    <div class="form_list base gap_mt24">
                                        <div class="form_group">
                                            <div class="item">
                                                <div class="cell">
                                                    <div class="form_item">
                                                        <div class="group_box">
                                                            <div class="box">
                                                                <span class="data_badge1">문의</span>
                                                            </div>
                                                            <div class="box">
                                                                <div class="inp_select size_190">
                                                                    <select title="카테고리 선택">
                                                                        <option value="">카테고리</option>
                                                                        <option value="">교육</option>
                                                                        <option value="">평가시험</option>
                                                                        <option value="">실무교육</option>
                                                                        <option value="">자격증</option>
                                                                        <option value="">결제</option>
                                                                        <option value="">기타</option>
                                                                    </select>
                                                                </div>
                                                            </div>
                                                            <div class="box">
                                                                <div class="inp size_360">
                                                                    <input type="text" placeholder="제목을 입력하세요" autocomplete="off" />
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="form_group">
                                            <div class="item">
                                                <div class="cell">
                                                    <div class="form_item">
                                                        <div class="inp_textarea">
                                                            <textarea placeholder="내용을 입력하세요" style="height: 144px"></textarea>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <!--// board_write -->
                                </div>
                                <!--// form-->

                                <div class="drop_file_set gap_mt24">
                                    <div class="drop-zone">
                                        <div>
                                            <span class="drop-zone__prompt">첨부할 파일을 여기에 끌어다 놓거나. 파일 선택 버튼을 직접 선택해주세요.</span>
                                            <input type="file" name="myFile" class="drop-zone__input" id="file111" />
                                            <label for="file111">파일찾기</label>
                                        </div>
                                        <div class="drop-list"></div>
                                    </div>
                                </div>
                                <style>
                                    .drop-zone {
                                        width: 100%;
                                        height: 18rem;
                                    }

                                    .drop-zone--over {
                                        border-style: solid;
                                    }

                                    .drop-zone__input {
                                        display: none;
                                    }

                                    .filess {
                                        width: 100%;
                                        height: 100%;
                                        border-radius: 10px;
                                        overflow: hidden;
                                        background-color: #cccccc;
                                        background-size: cover;
                                        position: relative;
                                    }

                                    .filess::after {
                                        content: attr(data-label);
                                        position: absolute;
                                        bottom: 0;
                                        left: 0;
                                        width: 100%;
                                        padding: 5px 0;
                                        color: #ffffff;
                                        background: rgba(0, 0, 0, 0.75);
                                        font-size: 14px;
                                        text-align: center;
                                    }
                                </style>
                            </div>
                            <!--// board -->
                        </div>
                        <!--// section(e) -->

                        <div class="bottom_btn_area center">
                            <div class="lside">
                                <button type="button" class="btn_primary_lg">수정</button>
                            </div>
                            <div class="rside">
                                <button type="button" class="btn_outline_lg">목록</button>
                            </div>
                        </div>
                    </div>
                    <!--// contents(e) -->
                </div>
            </div>
            <!--// container(e) -->

            <!-- [include] footer(s) : 확인용 -->
            <div data-include-file="../include/footer.html" class="includeJs"></div>
            <!--// [include] footer(e) : 확인용 -->
        </div>
        <!--// wrap(e) -->
        <script src="/resources/js/jquery-2.2.4.min.js"></script>
        <script src="/resources/js/ui.js"></script>
        <script>
            // 첨부파일 샘플
            // $("#file1").on("change", function () {
            //     var fileName = $(this).val().split("/").pop().split("\\").pop(); // 파일명만 추출
            //     $(this).parent().children().children("input").val(fileName);
            // });
            // $(".file_set .btn_reset").click(function () {
            //     $(this).parent().children("input").val(""); // 파일명 삭제
            // });

            document.querySelectorAll(".drop-zone__input").forEach((inputElement) => {
                const dropZoneElement = inputElement.closest(".drop-zone");
                const dropZoneElementList = inputElement.parent(".drop-zone").children(".drop-list");

                dropZoneElement.addEventListener("click", (e) => {
                    inputElement.click();
                });

                inputElement.addEventListener("change", (e) => {
                    if (inputElement.files.length) {
                        updateThumbnail(dropZoneElement, inputElement.files[0]);
                    }
                });

                dropZoneElement.addEventListener("dragover", (e) => {
                    e.preventDefault();
                    dropZoneElement.classList.add("drop-zone--over");
                });

                ["dragleave", "dragend"].forEach((type) => {
                    dropZoneElement.addEventListener(type, (e) => {
                        dropZoneElement.classList.remove("drop-zone--over");
                    });
                });

                dropZoneElement.addEventListener("drop", (e) => {
                    e.preventDefault();

                    if (e.dataTransfer.files.length) {
                        inputElement.files = e.dataTransfer.files;
                        updateThumbnail(dropZoneElement, e.dataTransfer.files[0]);
                    }

                    dropZoneElement.classList.remove("drop-zone--over");
                });
            });

            /**
             * Updates the thumbnail on a drop zone element.
             *
             * @param {HTMLElement} dropZoneElement
             * @param {File} file
             */
            function updateThumbnail(dropZoneElement, file) {
                let thumbnailElement = dropZoneElement.querySelector(".filess");

                // First time - remove the prompt
                if (dropZoneElement.querySelector(".drop-zone__prompt")) {
                    dropZoneElement.querySelector(".drop-zone__prompt").remove();
                }

                // First time - there is no thumbnail element, so lets create it
                if (!thumbnailElement) {
                    thumbnailElement = document.createElement("div");
                    thumbnailElement.classList.add("filess");
                    dropZoneElementList.append(thumbnailElement);
                }

                thumbnailElement.dataset.label = file.name;

                // Show thumbnail for image files
                if (file.type.startsWith("image/")) {
                    const reader = new FileReader();

                    reader.readAsDataURL(file);
                    reader.onload = () => {
                        thumbnailElement.style.backgroundImage = `url('${reader.result}')`;
                    };
                } else {
                    thumbnailElement.style.backgroundImage = null;
                }
            }
        </script>
    </body>
</html>
